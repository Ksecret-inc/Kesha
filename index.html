<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --hover: rgba(11,11,11,0.04);
    --accent: #2a78d6;
    --accent-soft: rgba(42,120,214,0.12);
    --bar: #2a78d6;
    --bar-dim: #cde2fb;
    --up: #006300;
    --down: #d03b3b;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
    --shadow: 0 6px 24px rgba(0,0,0,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink-1: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,0.18); --bar: #3987e5; --bar-dim: #1c3555;
      --up: #0ca30c; --down: #e66767;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
      --shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink-1: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,0.18); --bar: #3987e5; --bar-dim: #1c3555;
    --up: #0ca30c; --down: #e66767;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
    --shadow: 0 6px 24px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }

  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .source { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: #0ca30c; }
  button {
    font: inherit; color: var(--ink-1); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible, select:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* filters */
  .filters {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .fgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .flabel { color: var(--muted); font-size: 12px; margin-right: 4px; }
  select {
    font: inherit; color: var(--ink-1); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
    font-size: 13px; cursor: pointer; user-select: none; background: var(--surface); color: var(--ink-2);
  }
  .chip:hover { background: var(--hover); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink-1); font-weight: 600; }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .reset { margin-left: auto; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { color: var(--ink-2); font-size: 12px; }
  .kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; }
  .kpi .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi .d .up { color: var(--up); font-weight: 600; }
  .kpi .d .down { color: var(--down); font-weight: 600; }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 15px; margin: 0; }
  .card .hint { color: var(--muted); font-size: 12px; }
  .cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lbl { fill: var(--ink-2); font-size: 12px; }
  .val { fill: var(--ink-1); font-size: 12px; font-variant-numeric: tabular-nums; }
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover { fill: var(--hover); }

  /* table */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  tbody tr:hover { background: var(--hover); }
  tfoot td { font-weight: 650; border-bottom: none; }
  td.heat { position: relative; }

  /* tooltip */
  .tip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    background: var(--surface); color: var(--ink-1); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12px; min-width: 160px;
    transition: opacity .08s;
  }
  .tip .t { font-weight: 650; margin-bottom: 6px; font-size: 13px; }
  .tip .r { display: flex; justify-content: space-between; gap: 16px; align-items: center; font-variant-numeric: tabular-nums; }
  .tip .r span:first-child { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .tip .tot { border-top: 1px solid var(--grid); margin-top: 6px; padding-top: 6px; font-weight: 650; }
  .tip .foot { color: var(--muted); margin-top: 6px; }

  @media (max-width: 860px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .reset { margin-left: 0; }
  }
  @media (max-width: 420px) {
    .kpi .v { font-size: 21px; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>매출 대시보드</h1>
      <div class="sub" id="subtitle">월별 · 제품별 · 채널별 매출</div>
    </div>
    <div class="source">
      <span class="dot" id="srcDot"></span>
      <span id="srcText">데이터 불러오는 중…</span>
      <button id="refresh" type="button" title="Google 시트에서 다시 불러오기">새로고침</button>
    </div>
  </header>

  <section class="filters" aria-label="필터">
    <div class="fgroup">
      <span class="flabel">기간</span>
      <select id="fromSel" aria-label="시작 월"></select>
      <span class="flabel">~</span>
      <select id="toSel" aria-label="종료 월"></select>
    </div>
    <div class="fgroup" id="prodChips"><span class="flabel">제품</span></div>
    <div class="fgroup" id="chanChips"><span class="flabel">채널</span></div>
    <button class="reset" id="resetBtn" type="button">필터 초기화</button>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card wide">
      <div class="cardhead">
        <div>
          <h2>월별 매출</h2>
          <div class="hint">막대를 클릭하면 해당 월만 봅니다 · 다시 클릭하면 해제</div>
        </div>
        <div class="legend" id="monthLegend"></div>
      </div>
      <div id="monthChart"></div>
    </div>

    <div class="card">
      <div class="cardhead">
        <div>
          <h2>제품별 매출</h2>
          <div class="hint">클릭해서 제품 선택/해제 (여러 개 가능)</div>
        </div>
      </div>
      <div id="prodChart"></div>
    </div>

    <div class="card">
      <div class="cardhead">
        <div>
          <h2>채널별 매출</h2>
          <div class="hint">클릭해서 채널 선택/해제 (여러 개 가능)</div>
        </div>
      </div>
      <div id="chanChart"></div>
    </div>

    <div class="card wide">
      <div class="cardhead">
        <div>
          <h2>제품 × 채널 매출표</h2>
          <div class="hint">현재 필터 기준 · 단위: 원</div>
        </div>
      </div>
      <div class="tablewrap" id="pivot"></div>
    </div>
  </section>
</div>
<div class="tip" id="tip" role="tooltip"></div>

  // ---------- data model ----------
  var data = [], months = [], products = [], channels = [];
  var state = { from: 0, to: 0, prods: new Set(), chans: new Set() };

  function load(rows) {
    data = rows.map(function (r) {
      return { m: r[0], p: r[1], c: r[2], q: +r[3], price: +r[4], disc: +r[5], rev: +r[6] };
    }).filter(function (d) { return d.m && d.p && d.c && isFinite(d.rev); });
    months = uniq(data.map(function (d) { return d.m; })).sort();
    products = uniq(data.map(function (d) { return d.p; }));
    channels = uniq(data.map(function (d) { return d.c; }));
    state.from = 0; state.to = months.length - 1;
    state.prods = new Set(); state.chans = new Set();
    buildControls();
    render();
  }
  function uniq(a) { var s = new Set(), o = []; a.forEach(function (x) { if (!s.has(x)) { s.add(x); o.push(x); } }); return o; }

  function chanColor(c) {
    var i = channels.indexOf(c);
    return i >= 0 && i < 8 ? "var(--c" + (i + 1) + ")" : "var(--muted)";
  }

  // filter helpers; `skip` ignores one dimension (crossfilter style)
  function rowsFor(opts) {
    opts = opts || {};
    return data.filter(function (d) {
      if (!opts.allMonths) {
        var mi = months.indexOf(d.m);
        if (mi < state.from || mi > state.to) return false;
      }
      if (opts.skip !== "p" && state.prods.size && !state.prods.has(d.p)) return false;
      if (opts.skip !== "c" && state.chans.size && !state.chans.has(d.c)) return false;
      return true;
    });
  }
  function sum(rows, k) { var s = 0; for (var i = 0; i < rows.length; i++) s += rows[i][k]; return s; }

  // ---------- formatting ----------
  function won(n) { return Math.round(n).toLocaleString("ko-KR") + "원"; }
  function short(n) {
    var a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e10 ? 0 : 2).replace(/\.?0+$/, "") + "억";
    if (a >= 1e4) return Math.round(n / 1e4).toLocaleString("ko-KR") + "만";
    return Math.round(n).toLocaleString("ko-KR");
  }
  function mLabel(m) { var p = m.split("-"); return p.length > 1 ? (+p[1]) + "월" : m; }
  function mLong(m) { var p = m.split("-"); return p.length > 1 ? p[0] + "년 " + (+p[1]) + "월" : m; }
  function pct(n) { return (n * 100).toFixed(1) + "%"; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }

  // ---------- controls ----------
  var fromSel = document.getElementById("fromSel");
  var toSel = document.getElementById("toSel");
  function buildControls() {
    var opts = months.map(function (m, i) { return '<option value="' + i + '">' + esc(mLong(m)) + "</option>"; }).join("");
    fromSel.innerHTML = opts; toSel.innerHTML = opts;
    buildChips("prodChips", "제품", products, state.prods, null);
    buildChips("chanChips", "채널", channels, state.chans, chanColor);
    var leg = document.getElementById("monthLegend");
    leg.innerHTML = channels.map(function (c) {
      return '<span><i style="background:' + chanColor(c) + '"></i>' + esc(c) + "</span>";
    }).join("");
  }
  function buildChips(id, label, list, set, colorFn) {
    var el = document.getElementById(id);
    el.innerHTML = '<span class="flabel">' + label + "</span>" + list.map(function (v) {
      var sw = colorFn ? '<span class="sw" style="background:' + colorFn(v) + '"></span>' : "";
      return '<span class="chip" role="button" tabindex="0" aria-pressed="false" data-v="' + esc(v) + '">' + sw + esc(v) + "</span>";
    }).join("");
    el.querySelectorAll(".chip").forEach(function (ch) {
      var toggle = function () { toggleSet(set, ch.getAttribute("data-v")); };
      ch.addEventListener("click", toggle);
      ch.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }
  function syncChips() {
    document.querySelectorAll("#prodChips .chip").forEach(function (ch) { ch.setAttribute("aria-pressed", state.prods.has(ch.getAttribute("data-v"))); });
    document.querySelectorAll("#chanChips .chip").forEach(function (ch) { ch.setAttribute("aria-pressed", state.chans.has(ch.getAttribute("data-v"))); });
    fromSel.value = state.from; toSel.value = state.to;
  }
  function toggleSet(set, v) {
    if (set.has(v)) set.delete(v); else set.add(v);
    render();
  }
  fromSel.addEventListener("change", function () {
    state.from = +fromSel.value; if (state.from > state.to) state.to = state.from; render();
  });
  toSel.addEventListener("change", function () {
    state.to = +toSel.value; if (state.to < state.from) state.from = state.to; render();
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    state.from = 0; state.to = months.length - 1; state.prods.clear(); state.chans.clear(); render();
  });

  // ---------- tooltip ----------
  var tip = document.getElementById("tip");
  function showTip(e, html) {
    tip.innerHTML = html; tip.style.opacity = 1;
    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tip.style.opacity = 0; }
  function tipRow(label, value, color) {
    return '<div class="r"><span>' + (color ? '<i style="background:' + color + '"></i>' : "") + esc(label) + "</span><span>" + value + "</span></div>";
  }

  // ---------- KPIs ----------
  function renderKpis() {

      var pg = pr.reduce(function (s, d) { return s + d.q * d.price; }, 0), prev_rev = sum(pr, "rev"), prev_q = sum(pr, "q");
      prev = { rev: prev_rev, qty: prev_q, disc: pg ? 1 - prev_rev / pg : 0, asp: prev_q ? prev_rev / prev_q : 0 };
    }
    var cmpLabel = len === 1 ? "전월 대비" : "직전 " + len + "개월 대비";
    function delta(cur, old, isPoint, invert) {
      if (!prev || !old) return '<span>' + (prev ? "" : "비교 기간 없음") + "</span>";
      var dv = isPoint ? (cur - old) * 100 : (cur / old - 1) * 100;
      var good = invert ? dv < 0 : dv > 0;
      var cls = Math.abs(dv) < 0.05 ? "" : (good ? "up" : "down");
      var arrow = dv > 0.05 ? "▲ " : dv < -0.05 ? "▼ " : "";
      var txt = arrow + Math.abs(dv).toFixed(1) + (isPoint ? "%p" : "%");
      return '<span class="' + cls + '">' + txt + "</span> " + cmpLabel;
    }
    var period = len === 1 ? mLong(months[state.from]) : mLong(months[state.from]) + " ~ " + mLong(months[state.to]);
    document.getElementById("subtitle").textContent = period + " · 제품 " + (state.prods.size || products.length) + "개 · 채널 " + (state.chans.size || channels.length) + "개";

    var kp = [
      { k: "총 매출", v: short(rev) + "원", title: won(rev), d: delta(rev, prev && prev.rev) },
      { k: "판매 수량", v: qty.toLocaleString("ko-KR") + "개", d: delta(qty, prev && prev.qty) },
      { k: "평균 판매단가", v: Math.round(asp).toLocaleString("ko-KR") + "원", d: delta(asp, prev && prev.asp) },
      { k: "평균 할인율", v: pct(disc), d: delta(disc, prev && prev.disc, true, true) }
    ];
    document.getElementById("kpis").innerHTML = kp.map(function (x) {
      return '<div class="kpi"><div class="k">' + x.k + '</div><div class="v"' + (x.title ? ' title="' + x.title + '"' : "") + ">" + x.v + '</div><div class="d">' + x.d + "</div></div>";
    }).join("");
  }

  // ---------- SVG helpers ----------
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  // returns { max, step } so that ticks land on round numbers
  function niceScale(v, target) {
    if (v <= 0) return { max: 1, step: 1 };
    var raw = v / target, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
    return { max: Math.ceil(v / step) * step, step: step };
  }
  // rect with rounded top (vertical) or rounded right (horizontal) end
  function roundTop(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
      "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
  }
  function roundRight(x, y, w, h, r) {
    r = Math.min(r, h / 2, w);
    return "M" + x + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
      "V" + (y + h - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + "H" + x + "Z";
  }

  // ---------- monthly stacked bars ----------
  function renderMonths() {
    var host = document.getElementById("monthChart");
    var W = Math.max(300, host.clientWidth), H = 300;
    var m = { t: 24, r: 8, b: 28, l: 52 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var rows = rowsFor({ allMonths: true });
    var shownCh = channels.filter(function (c) { return !state.chans.size || state.chans.has(c); });

    var agg = months.map(function (mo) {
      var byC = {}; shownCh.forEach(function (c) { byC[c] = 0; });
      var tot = 0, q = 0;
      rows.forEach(function (d) { if (d.m === mo && byC.hasOwnProperty(d.c)) { byC[d.c] += d.rev; tot += d.rev; q += d.q; } });
      return { m: mo, byC: byC, tot: tot, q: q };
    });
    var sc = niceScale(Math.max.apply(null, agg.map(function (a) { return a.tot; })) * 1.05, 5), max = sc.max;
    var y = function (v) { return m.t + ih - (v / max) * ih; };

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": "월별 채널별 매출 누적 막대 차트" });
    for (var i = 0; i * sc.step <= max + 1e-6; i++) {
      var v = sc.step * i, yy = y(v);
      el("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
      el("text", { x: m.l - 8, y: yy + 4, "text-anchor": "end", class: "tick" }, svg).textContent = short(v);
    }
    var band = iw / months.length, bw = Math.min(56, band * 0.62);
    var single = state.from === state.to;

    agg.forEach(function (a, idx) {
      var inRange = idx >= state.from && idx <= state.to;
      var cx = m.l + band * idx + band / 2, x0 = cx - bw / 2;
      var g = el("g", { opacity: inRange ? 1 : 0.28 }, svg);
      var base = 0, drawn = shownCh.filter(function (c) { return a.byC[c] > 0; });
      drawn.forEach(function (c, k) {
        var v = a.byC[c], y1 = y(base + v), y0 = y(base);
        var h = Math.max(0, y0 - y1 - (k > 0 ? 2 : 0));
        var top = k === drawn.length - 1;
        if (top) el("path", { d: roundTop(x0, y1, bw, h, 4), fill: chanColor(c) }, g);
        else el("rect", { x: x0, y: y1 + (0), width: bw, height: h, fill: chanColor(c) }, g);
        base += v;
      });
      if (a.tot > 0 && (inRange || band > 60)) {
        el("text", { x: cx, y: y(a.tot) - 6, "text-anchor": "middle", class: "val" }, g).textContent = short(a.tot);
      }
      el("text", { x: cx, y: H - 8, "text-anchor": "middle", class: "lbl", "font-weight": inRange && single ? 700 : 400 }, svg).textContent = mLabel(a.m);

      var hit = el("rect", { x: m.l + band * idx, y: m.t, width: band, height: ih, class: "hit", rx: 6, tabindex: 0, role: "button", "aria-label": mLong(a.m) + " " + won(a.tot) }, svg);
      hit.addEventListener("mousemove", function (e) {
        var html = '<div class="t">' + esc(mLong(a.m)) + "</div>";
        shownCh.slice().reverse().forEach(function (c) { html += tipRow(c, short(a.byC[c]) + "원", chanColor(c)); });
        html += '<div class="r tot"><span>합계</span><span>' + won(a.tot) + "</span></div>";
        html += tipRow("판매 수량", a.q.toLocaleString("ko-KR") + "개");
        html += '<div class="foot">' + (single && state.from === idx ? "클릭: 전체 기간으로" : "클릭: 이 달만 보기") + "</div>";
        showTip(e, html);
      });
      hit.addEventListener("mouseleave", hideTip);
      var pick = function () {
        if (single && state.from === idx) { state.from = 0; state.to = months.length - 1; }
        else { state.from = idx; state.to = idx; }
        hideTip(); render();
      };
      hit.addEventListener("click", pick);
      hit.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    host.replaceChildren(svg);
  }

  // ---------- horizontal bar chart (products / channels) ----------
  function renderHBar(hostId, list, key, set, skip, colorFn) {
    var host = document.getElementById(hostId);
    var rows = rowsFor({ skip: skip });
    var agg = list.map(function (name) {
      var r = rows.filter(function (d) { return d[key] === name; });
      return { name: name, rev: sum(r, "rev"), q: sum(r, "q") };
    }).sort(function (a, b) { return b.rev - a.rev; });
    var total = agg.reduce(function (s, a) { return s + a.rev; }, 0);

    var W = Math.max(280, host.clientWidth);
    var rowH = 40, m = { t: 4, r: 64, b: 4, l: Math.min(150, Math.max(90, W * 0.32)) };
    var H = m.t + m.b + rowH * agg.length;
    var iw = W - m.l - m.r;
    var max = Math.max.apply(null, agg.map(function (a) { return a.rev; })) || 1;
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": hostId === "prodChart" ? "제품별 매출 막대 차트" : "채널별 매출 막대 차트" });
    el("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, stroke: "var(--axis)" }, svg);

    agg.forEach(function (a, i) {
      var yTop = m.t + i * rowH, bh = 20, by = yTop + (rowH - bh) / 2;
      var selected = set.has(a.name), dim = set.size && !selected;
      var w = (a.rev / max) * iw;
      var fill = colorFn ? colorFn(a.name) : "var(--bar)";
      var g = el("g", { opacity: dim ? 0.35 : 1 }, svg);
      if (w > 0) el("path", { d: roundRight(m.l, by, Math.max(w, 2), bh, 4), fill: fill }, g);
      var name = a.name, maxChars = Math.floor((m.l - 12) / 12);
      if (name.length > maxChars) name = name.slice(0, maxChars - 1) + "…";
      el("text", { x: m.l - 10, y: by + bh / 2 + 4, "text-anchor": "end", class: "lbl", "font-weight": selected ? 700 : 400 }, svg).textContent = name;
      el("text", { x: m.l + w + 6, y: by + bh / 2 + 4, class: "val" }, g).textContent = short(a.rev);

      var hit = el("rect", { x: 0, y: yTop, width: W, height: rowH, class: "hit", rx: 6, tabindex: 0, role: "button", "aria-pressed": selected, "aria-label": a.name + " " + won(a.rev) }, svg);
      hit.addEventListener("mousemove", function (e) {
        var html = '<div class="t">' + esc(a.name) + "</div>" +
          tipRow("매출", won(a.rev), colorFn ? colorFn(a.name) : null) +
          tipRow("비중", total ? pct(a.rev / total) : "-") +
          tipRow("판매 수량", a.q.toLocaleString("ko-KR") + "개") +
          '<div class="foot">' + (selected ? "클릭: 선택 해제" : "클릭: 선택해서 필터") + "</div>";
        showTip(e, html);
      });
      hit.addEventListener("mouseleave", hideTip);
      var pick = function () { hideTip(); toggleSet(set, a.name); };
      hit.addEventListener("click", pick);
      hit.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    host.replaceChildren(svg);
  }

  // ---------- pivot table ----------
  function renderPivot() {
    var rows = rowsFor();
    var ps = products.filter(function (p) { return !state.prods.size || state.prods.has(p); });
    var cs = channels.filter(function (c) { return !state.chans.size || state.chans.has(c); });
    var cell = {}, rt = {}, ct = {}, gt = 0;
    rows.forEach(function (d) {
      var k = d.p + "\u0001" + d.c;
      cell[k] = (cell[k] || 0) + d.rev; rt[d.p] = (rt[d.p] || 0) + d.rev; ct[d.c] = (ct[d.c] || 0) + d.rev; gt += d.rev;
    });
    ps.sort(function (a, b) { return (rt[b] || 0) - (rt[a] || 0); });
    var html = "<table><thead><tr><th>제품</th>" + cs.map(function (c) {
      return '<th><span style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:' + chanColor(c) + '"></span>' + esc(c) + "</th>";
    }).join("") + "<th>합계</th><th>비중</th></tr></thead><tbody>";
    ps.forEach(function (p) {
      html += "<tr><td>" + esc(p) + "</td>" + cs.map(function (c) {
        return "<td>" + Math.round(cell[p + "\u0001" + c] || 0).toLocaleString("ko-KR") + "</td>";
      }).join("") + "<td><b>" + Math.round(rt[p] || 0).toLocaleString("ko-KR") + "</b></td><td>" + (gt ? pct((rt[p] || 0) / gt) : "-") + "</td></tr>";
    });
    html += "</tbody><tfoot><tr><td>합계</td>" + cs.map(function (c) {
      return "<td>" + Math.round(ct[c] || 0).toLocaleString("ko-KR") + "</td>";
    }).join("") + "<td>" + Math.round(gt).toLocaleString("ko-KR") + "</td><td>" + (gt ? "100.0%" : "-") + "</td></tr></tfoot></table>";
    document.getElementById("pivot").innerHTML = html;
  }

  function render() {
    if (!data.length) return;
    syncChips();
    renderKpis();
    renderMonths();
    renderHBar("prodChart", products, "p", state.prods, "p", null);
    renderHBar("chanChart", channels, "c", state.chans, "c", chanColor);
    renderPivot();
  }
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });

  // ---------- live loading from Google Sheets ----------
  function parseCSV(text) {
    var out = [], row = [], f = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(f); out.push(row); row = []; f = "";
      } else f += ch;
    }
    if (f !== "" || row.length) { row.push(f); out.push(row); }
    return out.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
  }
  function num(s) { var n = parseFloat(String(s).replace(/[^\d.\-]/g, "")); return isFinite(n) ? n : NaN; }
  function normMonth(s) {
    s = String(s).trim();
    var m = s.match(/(\d{4})\D{1,3}(\d{1,2})/);
    return m ? m[1] + "-" + ("0" + m[2]).slice(-2) : s;
  }
  function fromSheet(text) {
    var t = parseCSV(text);
    if (t.length < 2) throw new Error("empty");
    var h = t[0].map(function (x) { return x.trim(); });
    function col(name, fallback) { var i = h.findIndex(function (x) { return x.indexOf(name) === 0; }); return i >= 0 ? i : fallback; }
    var iM = col("월", 0), iP = col("제품", 1), iC = col("채널", 2), iQ = col("판매수량", 3), iPr = col("정가", 4), iD = col("할인율", 5), iR = col("매출", 6);
    var rows = t.slice(1).map(function (r) {
      return [normMonth(r[iM]), (r[iP] || "").trim(), (r[iC] || "").trim(), num(r[iQ]), num(r[iPr]), num(r[iD]) || 0, num(r[iR])];
    }).filter(function (r) { return r[0] && r[1] && r[2] && isFinite(r[6]); });
    if (!rows.length) throw new Error("no rows");
    return rows;
  }
  var srcDot = document.getElementById("srcDot"), srcText = document.getElementById("srcText");
  function setSource(live, when) {
    srcDot.className = "dot" + (live ? " live" : "");
    srcText.textContent = live ? "Google 시트 실시간 · " + when + " 불러옴" : "내장 데이터 (" + SNAPSHOT_DATE + " 기준) · 시트 연결 실패";
  }
  function fetchLive() {
    srcText.textContent = "Google 시트에서 불러오는 중…";
    fetch(LIVE_URL + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        var keep = { from: months[state.from], to: months[state.to], prods: new Set(state.prods), chans: new Set(state.chans) };
        load(fromSheet(text));
        // restore filters where still valid
        var f = months.indexOf(keep.from), t = months.indexOf(keep.to);
        if (f >= 0 && t >= 0) { state.from = f; state.to = t; }
        keep.prods.forEach(function (p) { if (products.indexOf(p) >= 0) state.prods.add(p); });
        keep.chans.forEach(function (c) { if (channels.indexOf(c) >= 0) state.chans.add(c); });
        render();
        setSource(true, new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }));
      })
      .catch(function () { setSource(false); });
  }
  document.getElementById("refresh").addEventListener("click", fetchLive);

  load(SNAPSHOT);
  setSource(false);
  srcText.textContent = "내장 데이터 표시 중 · 시트 연결 시도…";
  fetchLive();
})();
</script>
